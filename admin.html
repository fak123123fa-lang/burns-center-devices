<style>

.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}

.box{background:#F4F8F6;border-radius:14px;padding:12px;font-size:13px;line-height:1.8;margin:10px 0;white-space:pre-wrap;word-break:break-word}

.cred{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:6px 0}.cred div{background:var(--dk);color:#fff;border-radius:14px;padding:12px;text-align:center}.cred span{display:block;font-size:12px;color:#BFD8D5}.cred b{font-size:19px;letter-spacing:.5px;color:var(--gold);user-select:all}
.dh{display:flex;align-items:center;gap:14px;margin-bottom:6px}.dh .t{flex:1}
.tbl{width:100%;border-collapse:collapse;font-size:13px}.tbl th{background:#F2F6F5;text-align:right;padding:7px 8px;font-size:12px;color:var(--mut)}.tbl td{border-bottom:1px solid var(--line);padding:7px 8px}
.li{padding:9px 10px;border-radius:12px;background:#F7FAF9;margin-bottom:6px;font-size:13px;line-height:1.6}.li b{font-size:13.5px}.li small{color:var(--mut)}
.login{max-width:420px;margin:-30px auto 0;background:#fff;border-radius:24px;padding:24px;box-shadow:0 10px 30px rgba(11,43,48,.12)}
.login h2{margin:0 0 6px}.login p{color:var(--mut);margin:0 0 16px;font-size:13.5px}
#toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%) translateY(120px);background:var(--dk);color:#fff;padding:11px 18px;border-radius:14px;font-weight:700;z-index:99;transition:transform .3s;max-width:90vw;text-align:center}
#toast.on{transform:translateX(-50%)}
.foot{text-align:center;color:var(--mut);font-size:12px;margin-top:24px}
.sec{font-weight:800;color:var(--mut);font-size:13px;margin:16px 4px 8px}
@media(max-width:700px){.kpis{grid-template-columns:repeat(2,1fr)}.kpis .kpi:last-child{grid-column:span 2}.grid{grid-template-columns:1fr}.top h1{font-size:17px}}
</style>

<body>
<div class="top"><div class="row"><div class="logo">🏛️</div><div><h1>لوحة القيادة</h1><small>منظومة إدارة الأجهزة الطبية</small><span id="lvl"></span></div><div class="sp"></div><span id="topBtns"></span></div></div>

<div class="back" id="back" onclick="if(event.target===this)closeS()"><div class="sheet" id="sheet"></div></div>
<div id="toast"></div>
<script>
"use strict";
const URL_='https://jmvbxnmvoqvumsljsqff.supabase.co',KEY='sb_publishable_hKnkJCFz9MudI2wUrbtaxQ_iBYB3kt3';
const BASE='https://fak123123fa-lang.github.io/burns-center-devices/';
const SK='adm_session_v1',DOM='@orgs.medtech.local';
const $=id=>document.getElementById(id);
const E=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const JA=v=>JSON.stringify(v).replace(/'/g,'&#39;').replace(/</g,'\\u003c');
const uname=e=>String(e||'').replace(DOM,'');
let S=null,ME=null,U=[],O=[],FEED=null,MIN=null,TAB='tree',Q='',PF='',SORT='name',OPEN={};
try{S=JSON.parse(localStorage.getItem(SK)||'null')}catch(e){}
try{OPEN=JSON.parse(localStorage.getItem('adm_open')||'{}')}catch(e){}
function toast(t){const x=$('toast');x.textContent=t;x.classList.add('on');clearTimeout(x._t);x._t=setTimeout(()=>x.classList.remove('on'),2600)}
function saveS(){try{S?localStorage.setItem(SK,JSON.stringify(S)):localStorage.removeItem(SK)}catch(e){}}
async function req(path,opt={}){
 const h={apikey:KEY,'Content-Type':'application/json'};if(opt.auth!==false&&S)h.Authorization='Bearer '+S.access_token;
 let r;try{r=await fetch(URL_+path,{method:opt.method||'GET',headers:h,body:opt.body?JSON.stringify(opt.body):undefined})}catch(e){const er=new Error('لا يوجد اتصال بالإنترنت');er.net=true;throw er}
 const t=await r.text();let j=null;try{j=t?JSON.parse(t):null}catch(e){j=t}
 if(!r.ok){const er=new Error((j&&(j.message||j.error_description||j.msg||j.error))||('خطأ '+r.status));er.status=r.status;throw er}return j}
function setSess(j){S={access_token:j.access_token,refresh_token:j.refresh_token,expires_at:j.expires_at||Math.floor(Date.now()/1000)+(j.expires_in||3600),email:(j.user&&j.user.email)||(S&&S.email)};saveS()}
async function ensure(){if(!S)throw new Error('login');if(S.expires_at&&Date.now()/1000>S.expires_at-60){try{setSess(await req('/auth/v1/token?grant_type=refresh_token',{method:'POST',auth:false,body:{refresh_token:S.refresh_token}}))}catch(e){S=null;saveS();throw new Error('login')}}}
const rpc=async(fn,body)=>{await ensure();return req('/rest/v1/rpc/'+fn,{method:'POST',body:body||{}})};
async function fn(action,body){await ensure();const r=await fetch(URL_+'/functions/v1/org-admin',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+S.access_token},body:JSON.stringify({action,...body})});const j=await r.json().catch(()=>({}));if(!r.ok||j.error)throw new Error(j.error||('خطأ '+r.status));return j}
function err(e){const m=String(e&&e.message||e);
 if(/username_taken/.test(m))return 'اسم المستخدم مستخدم، اختر غيره';if(/not_admin|not_allowed|forbidden/.test(m))return 'ليست لديك صلاحية لهذا الإجراء';if(/confirm_mismatch/.test(m))return 'رمز التأكيد غير مطابق';
 if(/not_empty/.test(m))return 'لا يمكن الحذف: تحتوي على قطاعات أو مؤسسات';if(/cannot_remove_self/.test(m))return 'لا يمكنك حذف حسابك';if(/Invalid login/i.test(m))return 'اسم المستخدم أو كلمة السر غير صحيحة';return m}
function copy(t){(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>toast('✅ تم النسخ')).catch(()=>toast('انسخ النص يدويًا'))}
function sheet(h){$('sheet').innerHTML=h;$('back').classList.add('on');$('sheet').scrollTop=0}
function closeS(){$('back').classList.remove('on')}

/* ================= الدخول ================= */
function loginView(){$('topBtns').innerHTML='';$('lvl').innerHTML='';
 const u=(location.search.match(/[?&]u=([^&#]+)/)||[])[1];
 $('app').innerHTML=`<div class="login"><h2>🔐 تسجيل الدخول</h2><p>لحسابات الوزارة ودوائر الصحة والقطاعات. اسم المستخدم وكلمة السر من مسؤول المنظومة.</p>
 <div class="f"><label>اسم المستخدم</label><input id="em" dir="ltr" autocapitalize="off" autocomplete="username" value="${E(u?decodeURIComponent(u):(S&&uname(S.email))||'')}"></div>
 <div class="f"><label>كلمة السر</label><input id="pw" type="password" dir="ltr" autocomplete="current-password" onkeydown="if(event.key==='Enter')doLogin()"></div>
 <button class="btn" style="width:100%" id="lgB" onclick="doLogin()">دخول</button></div><p class="foot">مؤسسة الفرقان البرمجية — رصانة، دقة، أمان</p>`;
 setTimeout(()=>{const f=$(u?'pw':'em');f&&f.focus()},200)}
async function doLogin(){let em=$('em').value.trim().toLowerCase(),pw=$('pw').value;if(!em||!pw)return toast('اكتب اسم المستخدم وكلمة السر');if(!em.includes('@'))em+=DOM;$('lgB').disabled=true;
 try{setSess(await req('/auth/v1/token?grant_type=password',{method:'POST',auth:false,body:{email:em,password:pw}}));await start()}catch(e){toast(err(e))}finally{const b=$('lgB');if(b)b.disabled=false}}
function logout(){S=null;saveS();loginView()}

/* ================= التحميل ================= */
async function start(){$('app').innerHTML='<div class="empty">⏳ جاري التحميل…</div>';
 try{ME=await rpc('dash_me');
  if(!ME||!ME.level){$('app').innerHTML=`<div class="login"><h2>⛔ لا توجد صلاحية</h2><p>الحساب ${E(S&&uname(S.email))} ليس حساب وزارة أو دائرة. حسابات المؤسسات تدخل من رابط مؤسستها.</p><button class="btn ghost" onclick="logout()">تسجيل خروج</button></div>`;return}
  $('lvl').innerHTML=ME.level==='ministry'?'<span class="lvl">🏛 حساب الوزارة — صلاحية كاملة</span>':`<span class="lvl">🏥 ${E(ME.units.map(u=>u.name).join('، '))}${ME.units.some(u=>u.role==='manager')?' — مدير':' — مشاهد'}</span>`;
  $('topBtns').innerHTML=`<button class="ib" onclick="refresh()">🔄</button> <button class="ib" onclick="logout()">خروج</button>`;
  await refresh();clearInterval(window.__ri);window.__ri=setInterval(()=>{if(document.visibilityState==='visible'&&!$('back').classList.contains('on'))refresh(true)},60000)}
 catch(e){if(String(e.message)==='login')return loginView();$('app').innerHTML=`<div class="empty">⚠️ ${E(err(e))}<br><br><button class="btn" onclick="start()">إعادة المحاولة</button></div>`}}
async function refresh(quiet){try{const d=await rpc('dash_overview');U=d.units||[];O=d.orgs||[];try{FEED=await rpc('dash_feed',{p_limit:60})}catch(e){FEED=null}
  if(ME.level==='ministry'){try{MIN=await rpc('ministry_list')}catch(e){MIN=null}}render()}catch(e){if(String(e.message)==='login')return loginView();if(!quiet)toast(err(e))}}

/* ================= حسابات ================= */
const pct=o=>{const n=+o.devices||0;if(!n)return null;return Math.round((n-(+o.broken||0)-(+o.maint||0))*100/n)};
const col=p=>p==null?'#9AA9AE':p>=85?'var(--grn)':p>=65?'var(--amb)':'var(--red)';
const ring=(p,lg)=>`<div class="ring ${lg?'lg':''}" style="--p:${p||0};--c:${col(p)}"><i>${p==null?'—':p+'%'}</i></div>`;
function ago(t){if(!t)return '—';const d=(Date.now()-new Date(t))/1000;if(d<90)return 'الآن';if(d<3600)return 'قبل '+Math.round(d/60)+' د';if(d<86400)return 'قبل '+Math.round(d/3600)+' س';return 'قبل '+Math.round(d/86400)+' يوم'}
const kids=id=>U.filter(u=>(u.parent_id||null)===id);
const uById=id=>U.find(u=>u.id===id),oById=id=>O.find(o=>o.id===id);
function subUnits(id){const r=[id];kids(id).forEach(k=>r.push(...subUnits(k.id)));return r}
function orgsUnder(id){const ids=new Set(subUnits(id));return O.filter(o=>ids.has(o.unit_id))}
function agg(list){const a={orgs:list.length,devices:0,broken:0,maint:0,open_faults:0,warranty_exp:0};list.filter(o=>o.active).forEach(o=>{for(const k of ['devices','broken','maint','open_faults','warranty_exp'])a[k]+=(+o[k]||0)});return a}
const roots=()=>{const vis=new Set(U.map(u=>u.id));return U.filter(u=>!u.parent_id||!vis.has(u.parent_id))};
function chain(id){const r=[];let u=uById(id);while(u){r.unshift(u);u=uById(u.parent_id)}return r}
const isMgr=id=>ME.level==='ministry'||(uById(id)||{}).role==='manager';
function link(o){return o.main?BASE+'app.html':BASE+'org.html?o='+o.id}

/* ================= العرض ================= */
function render(){const A=agg(O),p=A.devices?Math.round((A.devices-A.broken-A.maint)*100/A.devices):null;
 $('app').innerHTML=`<div class="kpis">
  <div class="kpi"><b>${O.filter(o=>o.active).length}</b><span>مؤسسة${U.length?' • '+U.length+' دائرة/قطاع':''}</span></div>
  <div class="kpi"><b>${A.devices}</b><span>جهازًا طبيًا</span></div>
  <div class="kpi"><b style="color:${col(p)}">${p==null?'—':p+'%'}</b><span>الجاهزية العامة</span></div>
  <div class="kpi r"><b>${A.broken+A.maint}</b><span>عاطل / صيانة</span></div>

 return (ME.level==='ministry'?`<option value="" ${!sel?'selected':''}>🏛 تتبع الوزارة مباشرة</option>`:'')+opts.join('')}
function topDir(id){const c=id?chain(id):[];const d=c.find(u=>u.kind==='directorate');return d?d.name:''}
function orgForm(unit){const pu=unit?uById(unit):null;sheet(`<h2>＋ مؤسسة جديدة</h2>
 <div class="f"><label>اسم المؤسسة *</label><input id="fN" placeholder="مثال: مستشفى الديوانية التعليمي"></div>
 <div class="f"><label>تتبع</label><select id="fU">${unitOptions(unit||'')}</select></div>
 <div class="row2"><div class="f"><label>المحافظة</label>${provSel(pu&&pu.province||'')}</div><div class="f"><label>اسم المستخدم (اختياري)</label><input id="fUs" dir="ltr" placeholder="تلقائي" autocapitalize="off"></div></div>
 <p style="color:var(--mut);font-size:12.5px;margin:0 0 6px">يُعطى للمؤسسة اسم مستخدم وكلمة سر تلقائيًا، مع رابط تطبيقها.</p>
 <div class="sbtns"><button class="btn" id="fB" onclick="orgCreate()">إنشاء المؤسسة</button><button class="btn ghost" onclick="closeS()">إلغاء</button></div>`);setTimeout(()=>$('fN').focus(),100)}
async function orgCreate(){const n=$('fN').value.trim(),unit=$('fU').value||null,u=$('fUs').value.trim().toLowerCase();if(!n)return toast('اكتب اسم المؤسسة');if(u&&!/^[a-z][a-z0-9_.-]{2,30}$/.test(u))return toast('اسم المستخدم: حروف إنجليزية صغيرة وأرقام');$('fB').disabled=true;
 try{const id=await rpc('org_create',{p_name:n,p_directorate:topDir(unit),p_province:$('fP').value,p_owner_email:null,p_notes:null,p_unit:unit});
  let c;try{c=await fn('create_user',{scope:'org',org:id,role:'owner',username:u})}catch(e){if(/username_taken/.test(e.message))c=await fn('create_user',{scope:'org',org:id,role:'owner'});else throw e}
  if(unit){OPEN[unit]=true;try{localStorage.setItem('adm_open',JSON.stringify(OPEN))}catch(e){}}await refresh(true);sheet(credView('org',id,c.username,c.password,'owner','✅ أُنشئت المؤسسة'))}catch(e){toast(err(e));const b=$('fB');if(b)b.disabled=false}}
function orgEdit(id){const o=oById(id);sheet(`<h2>✏️ تعديل ${E(o.name)}</h2>
 <div class="f"><label>اسم المؤسسة</label><input id="fN" value="${E(o.name)}"></div>
 <div class="f"><label>تتبع</label><select id="fU">${unitOptions(o.unit_id||'')}</select></div>
 <div class="row2"><div class="f"><label>المحافظة</label>${provSel(o.province||'')}</div><div class="f"><label>الحالة</label><select id="fA"><option value="1" ${o.active?'selected':''}>✅ فعّالة</option><option value="0" ${o.active?'':'selected'}>⏸ موقوفة</option></select></div></div>
 <div class="f"><label>ملاحظات</label><textarea id="fT" rows="2">${E(o.notes||'')}</textarea></div>
 <div class="sbtns"><button class="btn" onclick="orgSave('${id}')">حفظ</button><button class="btn ghost" onclick="detail('${id}')">رجوع</button></div>
 <div class="sbtns"><button class="btn red" onclick="orgDel('${id}')">🗑 حذف المؤسسة وكل بياناتها</button></div>`)}
async function orgSave(id){const unit=$('fU').value||null;try{await rpc('org_update',{p_org:id,p_name:$('fN').value,p_directorate:topDir(unit),p_province:$('fP').value,p_active:$('fA').value==='1',p_notes:$('fT').value||null,p_unit:unit});await refresh(true);detail(id);toast('✅ حُفظت')}catch(e){toast(err(e))}}
async function orgDel(id){const o=oById(id);const c=prompt(`حذف «${o.name}» نهائيًا مع كل أجهزتها وبلاغاتها. لا يمكن التراجع.\n\nللتأكيد اكتب رمز المؤسسة: ${o.id}`);if(c==null)return;
 try{if(c.trim()!==o.id)throw new Error('confirm_mismatch');for(const m of (o.members||[])){try{await fn('delete_user',{scope:'org',org:id,user_id:m.user_id})}catch(e){}}await rpc('org_delete',{p_org:id,p_confirm:c.trim()});closeS();await refresh();toast('🗑 حُذفت المؤسسة')}catch(e){toast(err(e))}}
function shareOrg(id){const o=oById(id),L=link(o);window.__msg=`📲 تطبيق إدارة الأجهزة الطبية — ${o.name}\nافتح الرابط واضغط «تثبيت»، ثم سجّل الدخول باسم المستخدم وكلمة السر الخاصة بمؤسستك:\n${L}`;window.__lnk=L;
 sheet(`<h2>🔗 رابط ${E(o.name)}</h2><div class="box" dir="ltr" style="text-align:left">${E(L)}</div><div class="sbtns"><button class="btn wa" onclick="window.open('https://wa.me/?text='+encodeURIComponent(window.__msg),'_blank')">💬 واتساب</button><button class="btn ghost" onclick="copy(window.__lnk)">📋 نسخ</button></div><div class="sbtns"><button class="btn ghost" onclick="detail('${id}')">رجوع</button></div>`)}
function exportCsv(){const H=['المؤسسة','تتبع','المحافظة','الحالة','الأجهزة','عاطل','صيانة','الجاهزية %','بلاغات مفتوحة','ضمانات منتهية','المالك','آخر تحديث','الرابط'];
 const rows=O.map(o=>[o.name,o.unit_id?chain(o.unit_id).map(u=>u.name).join(' / '):'الوزارة',o.province||'',o.active?'فعّالة':'موقوفة',o.devices,o.broken,o.maint,pct(o)??'',o.open_faults,o.warranty_exp,(o.members||[]).filter(m=>m.role==='owner').map(m=>uname(m.email)).join(' / '),o.updated_at?new Date(o.updated_at).toLocaleString('ar-IQ'):'',link(o)]);
 const csv='﻿'+[H,...rows].map(r=>r.map(v=>'"'+String(v==null?'':v).replace(/"/g,'""')+'"').join(',')).join('\r\n');
 const b=new Blob([csv],{type:'text/csv;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='المؤسسات_'+new Date().toISOString().slice(0,10)+'.csv';a.click()}
if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});
S?start():loginView();
</script>
